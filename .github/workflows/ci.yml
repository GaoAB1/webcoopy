name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify lock file has cross-platform optional deps
        shell: bash
        run: |
          # A lock generated on Windows omits Linux platform packages, which
          # makes `npm ci` fail here. Fail fast with a clear fix hint instead
          # of a cryptic rollup error later.
          if ! node -e "
            const l = require('./package-lock.json');
            const need = [
              'node_modules/@rollup/rollup-linux-x64-gnu',
              'node_modules/@esbuild/linux-x64'
            ];
            const missing = need.filter((k) => !l.packages[k]);
            if (missing.length) { console.error('missing:', missing.join(', ')); process.exit(1); }
          "; then
            echo "::error::package-lock.json is missing Linux platform packages. Run 'npm run fix:lock' and commit."
            exit 1
          fi

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # package-lock.json is normalised by scripts/patch-lock-optional-deps.mjs
        # so it carries platform-specific optional deps for every OS. Without
        # that patch a Windows-generated lock makes `npm ci` fail on Linux with
        # "Cannot find module @rollup/rollup-linux-x64-gnu" (npm/cli#4828).
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Smoke test (CLI --help)
        run: node dist/index.js --help

      # Verify the web server actually binds and answers /api/health, then
      # shut it down. A plain `--web` invocation blocks forever, so the server
      # is started from a Node script that polls health and exits.
      - name: Smoke test (web server + /api/health)
        shell: bash
        run: |
          node dist/index.js --web --host 127.0.0.1 --port 31337 --out ./smoke-out &
          SERVER_PID=$!
          ok=0
          for i in $(seq 1 20); do
            sleep 1
            if node -e "fetch('http://127.0.0.1:31337/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ok=1
              break
            fi
          done
          kill $SERVER_PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "web server health check failed"
            exit 1
          fi
          echo "web server health check passed"

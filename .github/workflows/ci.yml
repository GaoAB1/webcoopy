name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # NOTE: `npm ci` is intentionally avoided. package-lock.json is
        # generated on Windows, and npm does not resolve platform-specific
        # optional deps (e.g. @rollup/rollup-linux-x64-gnu) from a lock file
        # produced on another OS — `npm ci` then fails on Linux with
        # "Cannot find module @rollup/rollup-linux-x64-gnu".
        # See https://github.com/npm/cli/issues/4828
        # The Dockerfile works around the same bug the same way.
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Smoke test (CLI --help)
        run: node dist/index.js --help

      # Verify the web server actually binds and answers /api/health, then
      # shut it down. A plain `--web` invocation blocks forever, so the server
      # is started from a Node script that polls health and exits.
      - name: Smoke test (web server + /api/health)
        shell: bash
        run: |
          node dist/index.js --web --host 127.0.0.1 --port 31337 --out ./smoke-out &
          SERVER_PID=$!
          ok=0
          for i in $(seq 1 20); do
            sleep 1
            if node -e "fetch('http://127.0.0.1:31337/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ok=1
              break
            fi
          done
          kill $SERVER_PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "web server health check failed"
            exit 1
          fi
          echo "web server health check passed"
